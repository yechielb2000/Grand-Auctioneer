name: auction_empire
description: A mobile auction and property empire game prototype.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  firebase_analytics: ^13.1.0
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  firebase_remote_config: ^7.1.0
  firebase_storage: ^14.1.0
  cloud_firestore: ^7.2.0
  google_mobile_ads: ^7.0.0
  google_sign_in: ^6.3.0
  flutter_svg: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/currency/
    - assets/icons/auctions/
    - assets/icons/categories/
    - assets/icons/navigation/

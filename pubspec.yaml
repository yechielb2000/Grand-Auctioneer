name: auction_empire
description: A mobile auction and property empire game prototype.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_analytics: ^11.6.0
  firebase_auth: ^5.7.0
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  firebase_remote_config: ^5.5.0
  firebase_storage: ^12.4.10
  cloud_firestore: ^5.6.12
  google_mobile_ads: ^5.3.1
  google_sign_in: ^6.3.0
  flutter_svg: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/currency/
    - assets/icons/auctions/
    - assets/icons/categories/
    - assets/icons/navigation/
